{% extends 'base.html' %}

{% block title %}Organizer Login | STEMA{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6 relative overflow-hidden">
        
        <!-- Glow accent -->
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-emerald-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-cyan-500/10 rounded-full blur-2xl"></div>

        <div class="text-center space-y-2 relative z-10">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="font-display font-black text-2xl text-white">Organizer Portal</h2>
            <p class="text-xs text-slate-400">Restricted access for event administrators and gate managers.</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 rounded-2xl p-3 text-red-400 text-xs text-center font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4 relative z-10">
            <div>
                <label for="admin_pin" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Organizer Access PIN / Password</label>
                <div class="relative">
                    <input type="password" id="admin_pin" name="admin_pin" required placeholder="Enter organizer PIN..."
                           class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-2xl px-4 py-3.5 text-white text-sm outline-none transition placeholder-slate-600">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm">
                        <i id="toggle-eye" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full btn-gleam bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-black py-3.5 rounded-2xl shadow-lg shadow-emerald-500/25 transition-all text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Unlock Organizer Portal</span>
            </button>
        </form>

        <div class="text-center pt-2 relative z-10">
            <a href="{{ url_for('home') }}" class="text-xs text-slate-500 hover:text-slate-300 transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Event Home
            </a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const input = document.getElementById('admin_pin');
    const eye = document.getElementById('toggle-eye');
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
